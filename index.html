<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Türkiye amatör telsiz röle istasyonları — çevrimdışı çalışan afet iletişim haritası">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AfetTelsiz">

  <title>Afet İletişim Haritası</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <!-- LeafletJS CSS — integrity hash olmadan, CDN güvenilirliği için -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ─────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">📡</span>
      <h1>Afet İletişim Haritası</h1>
    </div>
    <div class="header-right">
      <button id="btn-locate"   class="btn btn-locate"  title="Konumunuza yakın röleleri göster">📍 Konumum</button>
      <button id="btn-training" class="btn btn-secondary">📻 Rehber</button>
      <button id="btn-offline"  class="btn btn-primary" title="Çevrimdışı kullanım için harita parçalarını kaydet">💾 Kaydet</button>
    </div>
  </header>

  <!-- ── Main layout ────────────────────────────────── -->
  <div class="app-body">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Röle İstasyonları</h2>
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">Tümü</button>
          <button class="filter-btn"        data-filter="analog">Analog</button>
          <button class="filter-btn"        data-filter="digital">Dijital</button>
        </div>
      </div>
      <div class="relay-list" id="relay-list"></div>
    </aside>

    <main class="map-container">
      <div id="map"></div>
      <div class="offline-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Yükleniyor…</span>
      </div>
    </main>

  </div>

  <!-- ── Training modal ─────────────────────────────── -->
  <div class="modal-overlay" id="training-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="training-title">Programlama Rehberi</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="training-body"></div>
    </div>
  </div>


  <!-- LeafletJS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Uygulama -->
  <script src="app.js"></script>
</body>
</html>
