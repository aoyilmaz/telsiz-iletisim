<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Türkiye ve dünya amatör telsiz röle istasyonları — çevrimdışı afet iletişim haritası">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AfetTelsiz">

  <title>Afet İletişim Haritası</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Header ─────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left">
      <span class="header-icon">📡</span>
      <h1>Afet İletişim Haritası</h1>
    </div>
    <div class="header-right">
      <button id="btn-locate"   class="btn btn-locate"    title="Konumunuza yakın röleleri göster">📍 Konumum</button>
      <button id="btn-training" class="btn btn-secondary">📻 Rehber</button>
      <button id="btn-offline"  class="btn btn-primary"   title="Çevrimdışı kullanım için harita parçalarını kaydet">💾 Kaydet</button>
    </div>
  </header>

  <!-- ── Main layout ────────────────────────────────── -->
  <div class="app-body">

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Röle İstasyonları</h2>

        <!-- Ülke / Şehir seçici -->
        <div class="loc-selectors">
          <select id="select-country" class="loc-select">
            <option value="">🌍 Tüm Dünya</option>
            <option value="TR" data-label="Türkiye" data-rb="">🇹🇷 Türkiye</option>
            <optgroup label="Avrupa">
              <option value="DE" data-label="Almanya"          data-rb="Germany">🇩🇪 Almanya</option>
              <option value="AT" data-label="Avusturya"        data-rb="Austria">🇦🇹 Avusturya</option>
              <option value="BE" data-label="Belçika"          data-rb="Belgium">🇧🇪 Belçika</option>
              <option value="BG" data-label="Bulgaristan"      data-rb="Bulgaria">🇧🇬 Bulgaristan</option>
              <option value="CZ" data-label="Çek Cumhuriyeti"  data-rb="Czech Republic">🇨🇿 Çek Cumhuriyeti</option>
              <option value="DK" data-label="Danimarka"        data-rb="Denmark">🇩🇰 Danimarka</option>
              <option value="EE" data-label="Estonya"          data-rb="Estonia">🇪🇪 Estonya</option>
              <option value="FI" data-label="Finlandiya"       data-rb="Finland">🇫🇮 Finlandiya</option>
              <option value="FR" data-label="Fransa"           data-rb="France">🇫🇷 Fransa</option>
              <option value="NL" data-label="Hollanda"         data-rb="Netherlands">🇳🇱 Hollanda</option>
              <option value="HR" data-label="Hırvatistan"      data-rb="Croatia">🇭🇷 Hırvatistan</option>
              <option value="GB" data-label="İngiltere"        data-rb="United Kingdom">🇬🇧 İngiltere</option>
              <option value="IE" data-label="İrlanda"          data-rb="Ireland">🇮🇪 İrlanda</option>
              <option value="ES" data-label="İspanya"          data-rb="Spain">🇪🇸 İspanya</option>
              <option value="SE" data-label="İsveç"            data-rb="Sweden">🇸🇪 İsveç</option>
              <option value="CH" data-label="İsviçre"          data-rb="Switzerland">🇨🇭 İsviçre</option>
              <option value="IT" data-label="İtalya"           data-rb="Italy">🇮🇹 İtalya</option>
              <option value="IS" data-label="İzlanda"          data-rb="Iceland">🇮🇸 İzlanda</option>
              <option value="LV" data-label="Letonya"          data-rb="Latvia">🇱🇻 Letonya</option>
              <option value="LT" data-label="Litvanya"         data-rb="Lithuania">🇱🇹 Litvanya</option>
              <option value="HU" data-label="Macaristan"       data-rb="Hungary">🇭🇺 Macaristan</option>
              <option value="MK" data-label="Kuzey Makedonya"  data-rb="North Macedonia">🇲🇰 Kuzey Makedonya</option>
              <option value="NO" data-label="Norveç"           data-rb="Norway">🇳🇴 Norveç</option>
              <option value="PL" data-label="Polonya"          data-rb="Poland">🇵🇱 Polonya</option>
              <option value="PT" data-label="Portekiz"         data-rb="Portugal">🇵🇹 Portekiz</option>
              <option value="RO" data-label="Romanya"          data-rb="Romania">🇷🇴 Romanya</option>
              <option value="RS" data-label="Sırbistan"        data-rb="Serbia">🇷🇸 Sırbistan</option>
              <option value="SK" data-label="Slovakya"         data-rb="Slovakia">🇸🇰 Slovakya</option>
              <option value="SI" data-label="Slovenya"         data-rb="Slovenia">🇸🇮 Slovenya</option>
              <option value="GR" data-label="Yunanistan"       data-rb="Greece">🇬🇷 Yunanistan</option>
            </optgroup>
            <optgroup label="Amerika">
              <option value="US" data-label="ABD"       data-rb="United States">🇺🇸 ABD</option>
              <option value="CA" data-label="Kanada"    data-rb="Canada">🇨🇦 Kanada</option>
              <option value="MX" data-label="Meksika"   data-rb="Mexico">🇲🇽 Meksika</option>
              <option value="BR" data-label="Brezilya"  data-rb="Brazil">🇧🇷 Brezilya</option>
              <option value="AR" data-label="Arjantin"  data-rb="Argentina">🇦🇷 Arjantin</option>
              <option value="CL" data-label="Şili"      data-rb="Chile">🇨🇱 Şili</option>
              <option value="CO" data-label="Kolombiya" data-rb="Colombia">🇨🇴 Kolombiya</option>
            </optgroup>
            <optgroup label="Asya-Pasifik">
              <option value="AU" data-label="Avustralya"   data-rb="Australia">🇦🇺 Avustralya</option>
              <option value="NZ" data-label="Yeni Zelanda" data-rb="New Zealand">🇳🇿 Yeni Zelanda</option>
              <option value="JP" data-label="Japonya"      data-rb="Japan">🇯🇵 Japonya</option>
              <option value="KR" data-label="Güney Kore"   data-rb="South Korea">🇰🇷 Güney Kore</option>
              <option value="IN" data-label="Hindistan"    data-rb="India">🇮🇳 Hindistan</option>
              <option value="SG" data-label="Singapur"     data-rb="Singapore">🇸🇬 Singapur</option>
              <option value="MY" data-label="Malezya"      data-rb="Malaysia">🇲🇾 Malezya</option>
              <option value="TH" data-label="Tayland"      data-rb="Thailand">🇹🇭 Tayland</option>
              <option value="PH" data-label="Filipinler"   data-rb="Philippines">🇵🇭 Filipinler</option>
              <option value="ID" data-label="Endonezya"    data-rb="Indonesia">🇮🇩 Endonezya</option>
              <option value="HK" data-label="Hong Kong"    data-rb="Hong Kong">🇭🇰 Hong Kong</option>
            </optgroup>
            <optgroup label="Orta Doğu &amp; Afrika">
              <option value="IL" data-label="İsrail"      data-rb="Israel">🇮🇱 İsrail</option>
              <option value="JO" data-label="Ürdün"       data-rb="Jordan">🇯🇴 Ürdün</option>
              <option value="AE" data-label="BAE"         data-rb="United Arab Emirates">🇦🇪 BAE</option>
              <option value="ZA" data-label="Güney Afrika" data-rb="South Africa">🇿🇦 Güney Afrika</option>
              <option value="EG" data-label="Mısır"       data-rb="Egypt">🇪🇬 Mısır</option>
            </optgroup>
          </select>
          <select id="select-city" class="loc-select">
            <option value="">Tüm Şehirler</option>
          </select>
        </div>

        <!-- Arama -->
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="search" id="search-input" placeholder="İstasyon veya bölge ara…" autocomplete="off">
        </div>

        <!-- Filtre -->
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">Tümü</button>
          <button class="filter-btn"        data-filter="analog">Analog</button>
          <button class="filter-btn"        data-filter="digital">Dijital</button>
        </div>

        <!-- Yarıçap (konum alındıktan sonra görünür) -->
        <div class="radius-filter" id="radius-filter" style="display:none">
          <div class="radius-row">
            <span class="radius-lbl">Yarıçap: <strong id="radius-label">50 km</strong></span>
            <button id="btn-radius-reset" class="btn-link">Tümü göster</button>
          </div>
          <input type="range" id="radius-slider" min="10" max="500" step="10" value="50" class="radius-range">
        </div>
      </div>

      <div class="relay-list" id="relay-list"></div>
    </aside>

    <main class="map-container">
      <div id="map"></div>

      <!-- Bağlantı durumu -->
      <div class="offline-status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Yükleniyor…</span>
      </div>

      <!-- Mobil: liste aç/kapa -->
      <button id="btn-mobile-list" class="mobile-list-btn" title="Röle listesi">☰</button>
    </main>

    <!-- ── Referans paneli (ana gövde içinde) ── -->
    <aside class="ref-panel" id="ref-panel">
      <div class="ref-panel-inner">
        <div class="ref-panel-header">
          <h2>Acil Referans</h2>
          <button id="ref-panel-close" class="ref-panel-close">✕</button>
        </div>
        <div class="modal-tabs">
          <button class="modal-tab active" data-tab="tab-freqs">📡 Frekanslar</button>
          <button class="modal-tab"        data-tab="tab-protocol">🚨 Protokol</button>
          <button class="modal-tab"        data-tab="tab-guide">📻 Rehber</button>
          <button class="modal-tab"        data-tab="tab-qcodes">🔤 Q Kodları</button>
          <button class="modal-tab"        data-tab="tab-mesh">🌐 Mesh</button>
          <button class="modal-tab"        data-tab="tab-egitim">🎓 Eğitim</button>
        </div>
        <div class="modal-body" id="tab-freqs"></div>
        <div class="modal-body" id="tab-protocol" style="display:none"></div>
        <div class="modal-body" id="tab-guide"    style="display:none"></div>
        <div class="modal-body" id="tab-qcodes"   style="display:none"></div>
        <div class="modal-body" id="tab-mesh"     style="display:none"></div>
        <div class="modal-body" id="tab-egitim"   style="display:none"></div>
      </div>
    </aside>

  </div>

  <!-- Toast bildirimi -->
  <div id="toast" class="toast"></div>

  <!-- LeafletJS + MarkerCluster -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Uygulama -->
  <script src="app.js"></script>
</body>
</html>
